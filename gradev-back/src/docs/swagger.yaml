openapi: 3.0.3

info:
  title: Gradev API
  version: 1.0.0
  description: API documentation for Gradev — an English grading and classroom management application.

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Classes
    description: Class management endpoints

paths:
  /api/v1/classes/createClass:
    post:
      tags:
        - Classes
      summary: Create a new class
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassInput"
      responses:
        "201":
          description: Class created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          description: Invalid class data

  /api/v1/classes/getAllClasses:
    get:
      tags:
        - Classes
      summary: Retrieve all classes
      operationId: getAllClasses
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by class name or group name

        - name: book
          in: query
          schema:
            type: string
            enum:
              - Family & Friends
              - InterChange

        - name: level
          in: query
          schema:
            type: string
            enum:
              - "1"
              - "2"
              - "3"
              - "4"
              - Intro

        - name: semester
          in: query
          schema:
            type: string
            enum:
              - A
              - B
              - C

        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1

        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1

      responses:
        "200":
          description: Classes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"

  /api/v1/classes/getClassById/{id}:
    get:
      tags:
        - Classes
      summary: Retrieve a class by ID
      operationId: getClassById
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Class retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          description: Invalid class ID
        "404":
          description: Class not found

  /api/v1/classes/updateClass/{id}:
    patch:
      tags:
        - Classes
      summary: Update a class
      operationId: updateClass
      parameters:
        - $ref: "#/components/parameters/ClassId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassInput"
      responses:
        "200":
          description: Class updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "400":
          description: Invalid update data
        "404":
          description: Class not found

  /api/v1/classes/deleteClass/{id}:
    delete:
      tags:
        - Classes
      summary: Delete a class
      operationId: deleteClass
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Class deleted successfully
        "400":
          description: Invalid class ID
        "404":
          description: Class not found

components:
  parameters:
    ClassId:
      name: id
      in: path
      required: true
      description: MongoDB class ID
      schema:
        type: string
        example: 674a1f2b3c4d5e6f78901234

  schemas:
    Unit:
      type: object
      properties:
        unitNumber:
          type: number
          example: 6
        title:
          type: string
          example: Unit 6

    Class:
      type: object
      properties:
        _id:
          type: string
          example: 674a1f2b3c4d5e6f78901234
        name:
          type: string
          example: InterChange Intro B — Saturday Group
        groupName:
          type: string
          example: Saturday Group
        book:
          type: string
          enum:
            - Family & Friends
            - InterChange
        level:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
            - "4"
            - Intro
        semester:
          type: string
          enum:
            - A
            - B
            - C
        units:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateClassInput:
      type: object
      required:
        - groupName
        - book
        - level
        - semester
      properties:
        groupName:
          type: string
          minLength: 2
          maxLength: 50
          example: Saturday Group
        book:
          type: string
          enum:
            - Family & Friends
            - InterChange
          example: InterChange
        level:
          type: string
          example: Intro
        semester:
          type: string
          enum:
            - A
            - B
            - C
          example: B

    UpdateClassInput:
      type: object
      minProperties: 1
      properties:
        groupName:
          type: string
          minLength: 2
          maxLength: 50
        book:
          type: string
          enum:
            - Family & Friends
            - InterChange
        level:
          type: string
        semester:
          type: string
          enum:
            - A
            - B
            - C
